  <rect x="240" y="138" width="180" height="14" fill="#d1dae2"/>
  <rect x="824" y="134" width="32" height="22" fill="#d1dae2"/>
  <rect x="240" y="176" width="616" height="196" fill="#e1e7eb"/>
  <rect x="264" y="208" width="112" height="12" fill="#d1dae2"/>
  <rect x="400" y="208" width="300" height="12" fill="#d1dae2"/>
  <rect x="264" y="260" width="112" height="12" fill="#d1dae2"/>
  <rect x="400" y="260" width="240" height="12" fill="#d1dae2"/>
  <rect x="264" y="312" width="112" height="12" fill="#d1dae2"/>
  <rect x="400" y="312" width="336" height="12" fill="#d1dae2"/>
  <rect x="240" y="412" width="168" height="80" fill="#e1e7eb"/>
  <rect x="264" y="446" width="120" height="12" fill="#d1dae2"/>
  <rect x="408" y="450" width="56" height="4" fill="#d1dae2"/>
