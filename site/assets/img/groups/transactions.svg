    <path d="M6.2 12 H9.2"/>
    <path d="M9.2 8.2 H14.8 V15.8 H9.2 Z"/>
    <path d="M14.8 12 H17.8"/>
    <path d="M17.8 8.2 H23.4 V15.8 H17.8 Z"/>
