  <rect x="488" y="446" width="120" height="12" fill="#d1dae2"/>
  <rect x="632" y="450" width="56" height="4" fill="#d1dae2"/>
  <rect x="688" y="412" width="168" height="80" fill="#e1e7eb"/>
  <path d="M748 452 L764 468 L796 432" fill="none" stroke="#bdcbd7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

