<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Abstract app window with a record and a three-step flow, the last step checked">
  <!-- SS26 placeholder · ground -->
  <rect x="0" y="0" width="960" height="600" fill="#edf0f2"/>

  <!-- window, octagonal 4px cuts -->
  <polygon points="76,56 884,56 888,60 888,540 884,544 76,544 72,540 72,60" fill="#ffffff" stroke="#bdcbd7" stroke-width="1.5"/>

  <!-- title bar -->
  <polygon points="76,56 884,56 888,60 888,112 72,112 72,60" fill="#e1e7eb"/>
  <path d="M72 112 H888" stroke="#bdcbd7" stroke-width="1.5" fill="none"/>
  <rect x="100" y="78" width="12" height="12" fill="#bdcbd7"/>
  <rect x="122" y="78" width="12" height="12" fill="#bdcbd7"/>
  <rect x="144" y="78" width="12" height="12" fill="#bdcbd7"/>

  <!-- left rail -->
  <polygon points="72,112 208,112 208,544 76,544 72,540" fill="#e1e7eb"/>
  <path d="M208 112 V544" stroke="#bdcbd7" stroke-width="1.5" fill="none"/>
  <rect x="88" y="148" width="104" height="14" fill="#c1dff4"/>
  <rect x="88" y="184" width="104" height="14" fill="#d1dae2"/>
  <rect x="88" y="220" width="104" height="14" fill="#d1dae2"/>
  <rect x="88" y="256" width="104" height="14" fill="#d1dae2"/>
  <rect x="88" y="292" width="104" height="14" fill="#d1dae2"/>

