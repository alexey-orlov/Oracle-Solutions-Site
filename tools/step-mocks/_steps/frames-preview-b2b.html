<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Frame preview B2b (QA only)</title>
<style>
  body { margin: 0; padding: 16px 20px; background: #fff; font: 13px -apple-system, Helvetica, Arial, sans-serif; color: #26292b; width: 900px; }
  h2 { font-size: 14px; margin: 10px 0 6px; }
  .fr { position: relative; width: 872px; height: 545px; margin-bottom: 18px; }
  .fr .cut { position: absolute; inset: 0; clip-path: polygon(12px 0, calc(100% - 12px) 0, 100% 12px, 100% calc(100% - 12px), calc(100% - 12px) 100%, 12px 100%, 0 calc(100% - 12px), 0 12px); background: #bdcbd7; }
  .fr .cut img { position: absolute; inset: 1px; width: 870px; height: 543px; clip-path: inherit; }
  .reg { position: absolute; box-shadow: 0 0 0 2px #1485c4; }
  .ins { position: absolute; width: 401px; box-shadow: 0 0 0 2px #1485c4; }
  .ins img { display: block; width: 401px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  const DATA = {
    "case-evidence-collection": [
      {"n": 1, "region": [64.4, 18.8, 33.8, 36.4], "anchor": "bl", "zh": 540},
      {"n": 2, "region": [20.4, 39.5, 33.6, 17.3], "anchor": "br", "zh": 257},
      {"n": 3, "region": [52.5, 46.1, 32.8, 33.3], "anchor": "bl", "zh": 508},
      {"n": 4, "region": [64.4, 37.3, 33.8, 35.5], "anchor": "bl", "zh": 527}
    ]
  };
  const base = "../../../wt-r20/site/assets/img/steps/";
  const FW = 872, FH = 545, IW = 401, M = 24;
  const root = document.getElementById("root");
  const overlap = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
  for (const slug of Object.keys(DATA)) for (const s of DATA[slug]) {
    const [x, y, w, h] = s.region;
    const reg = { x: x / 100 * FW, y: y / 100 * FH, w: w / 100 * FW, h: h / 100 * FH };
    const ih = IW * s.zh / 802;
    const box = (a) => ({ x: a[1] === "r" ? FW - M - IW : M, y: a[0] === "b" ? FH - M - ih : M, w: IW, h: ih });
    const pick = ["br", "bl", "tr", "tl"].find(a => !overlap(box(a), reg));
    const ins = box(s.anchor);
    const scale = (IW / (w / 100 * 1280)).toFixed(3);
    root.insertAdjacentHTML("beforeend",
      `<h2>${slug} · step ${s.n} · anchor ${s.anchor} (rule picks ${pick}) · inset scale ${scale} · inset h ${ih.toFixed(0)}</h2>
       <div class="fr"><div class="cut"><img src="${base}${slug}-${s.n}.jpg"></div>
       <div class="reg" style="left:${reg.x}px;top:${reg.y}px;width:${reg.w}px;height:${reg.h}px"></div>
       <div class="ins" style="left:${ins.x}px;top:${ins.y}px;height:${ih}px"><img src="${base}${slug}-${s.n}-zoom.jpg"></div></div>`);
  }
</script>
</body>
</html>
